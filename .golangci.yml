# golangci-lint configuration
run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters-settings:
  govet:
    enable:
      - printf
      - structtag
      - loopclosure
  gocyclo:
    min-complexity: 15
  dupl:
    threshold: 100
  goconst:
    min-len: 3
    min-occurrences: 3
  misspell:
    locale: US
  lll:
    line-length: 120
  goimports:
    local-prefixes: connect4-multiplayer
  gocritic:
    enabled-tags:
      - performance
      - style
      - experimental
    disabled-checks:
      - wrapperFunc
      - dupImport
      - ifElseChain
      - hugeParam
      - paramTypeCombine

linters:
  enable:
    - bodyclose
    - dogsled
    - dupl
    - errcheck
    - goconst
    - gocritic
    - gocyclo
    - gofmt
    - goimports
    - gosec
    - gosimple
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - staticcheck
    - typecheck
    - unconvert
    - unparam
    - unused
    - whitespace
  disable:
    - depguard
    - gochecknoinits
    - stylecheck
    - prealloc

issues:
  exclude-dirs:
    - vendor
    - tmp
    - bin
    - docs
  exclude-files:
    - ".*_test\\.go"
    - "mock_.*\\.go"
  exclude-rules:
    # Test files: relax most linters
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - unparam
        - lll
    # cmd/ entry points: relax complexity
    - path: cmd/
      linters:
        - gocyclo
    # go:generate directives can be long
    - linters:
        - lll
      source: "^//go:generate "
    # Repository Create/GetByID methods follow the same retry pattern intentionally
    - path: internal/database/repositories/
      linters:
        - dupl
    # HTTP handler boilerplate duplication is acceptable
    - path: internal/api/handlers/
      linters:
        - dupl
    # "err" re-declarations in if-init statements are idiomatic Go
    - linters:
        - govet
      text: 'shadow: declaration of "err" shadows'
    # Long lines in function signatures with many parameters
    - linters:
        - lll
      source: "^func "
    # Long struct field tags are unavoidable
    - linters:
        - lll
      source: "`[^`]*gorm:[^`]*`|`[^`]*json:[^`]*`"
    # gocyclo: game logic and bot AI are inherently complex
    - path: pkg/models/game\.go
      linters:
        - gocyclo
    - path: internal/bot/minimax\.go
      linters:
        - gocyclo
    - path: internal/websocket/handler\.go
      linters:
        - gocyclo
    - path: internal/game/service\.go
      linters:
        - gocyclo
    - path: internal/api/handlers/game_handler\.go
      linters:
        - gocyclo
    # gosec G404: math/rand is intentional for game AI randomness, not security-sensitive
    - path: internal/websocket/handler\.go
      linters:
        - gosec
      text: "G404"
  exclude:
    - "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*printf?|os\\.(Un)?Setenv). is not checked"
    - "exported function .* should have comment or be unexported"
    - "should have a package comment, unless it's in another file for this package"